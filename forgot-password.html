<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – RentHub</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">RentHub</a>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Browse Products</a></li>
            <li><a href="about.html">About</a></li>
            <li id="nav-auth"><a href="login.html">Login / Register</a></li>
        </ul>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-controls="nav-links" aria-expanded="false">&#9776;</button>
    </nav>

    <main style="padding:2.5rem 1.5rem 4rem;">
        <section class="auth-section card" style="max-width:440px; margin:auto;">
            <h2 class="text-center" style="margin-bottom:0.75rem;">Reset Your Password</h2>
            <p class="text-center" style="color:var(--color-text-secondary); font-size:0.92rem; margin-bottom:1.5rem;">
                Enter your registered email address and we'll send you instructions to reset your password.
            </p>

            <form id="forgot-form" class="auth-form">
                <label for="forgot-email">Email Address
                    <input type="email" id="forgot-email" placeholder="name@example.com" required autocomplete="email" />
                </label>
                <button type="submit" id="forgot-submit-btn" class="btn primary" style="width:100%; margin-top:0.75rem;">Send Reset Link</button>
            </form>

            <div id="forgot-message" class="message text-center" style="display:none; margin-top:1.25rem;"></div>

            <p class="text-center" style="font-size:0.9rem; margin-top:1.5rem;">
                Remembered your password? <a href="login.html">Back to Sign In</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <h3>RentHub</h3>
            <p>&copy; 2026 RentHub – Rent Before You Buy. All rights reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { api } from "./js/api.js";
        import { syncNavbarAuth } from "./js/auth.js";

        syncNavbarAuth();

        const form = document.getElementById('forgot-form');
        const emailInput = document.getElementById('forgot-email');
        const submitBtn = document.getElementById('forgot-submit-btn');
        const msgDiv = document.getElementById('forgot-message');
        let countdownTimer = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (countdownTimer) return;

            const email = emailInput.value.trim();

            if (!email) {
                msgDiv.style.display = 'block';
                msgDiv.style.color = '#FB7185';
                msgDiv.textContent = 'Please enter your email address.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            msgDiv.style.display = 'none';

            try {
                const res = await api.post('/auth/forgotpassword', { email }, { timeoutMs: 15000 });
                msgDiv.style.display = 'block';
                msgDiv.style.color = 'var(--color-secondary)';
                msgDiv.textContent = res.message || 'If an account with that email exists, password reset instructions have been sent.';
                form.reset();
            } catch (err) {
                msgDiv.style.display = 'block';
                if (err.status === 429) {
                    msgDiv.style.color = '#FB7185';
                    let remaining = (typeof err.retryAfter === 'number' && err.retryAfter > 0) ? err.retryAfter : 900;
                    submitBtn.disabled = true;

                    const renderCountdown = () => {
                        const m = Math.floor(remaining / 60);
                        const s = remaining % 60;
                        const timeStr = m > 0 ? `${m}m ${s < 10 ? '0' : ''}${s}s` : `${s}s`;
                        msgDiv.textContent = `Too many attempts. For security, please wait ${timeStr} before trying again.`;
                        submitBtn.textContent = `Wait (${timeStr})`;
                    };

                    renderCountdown();
                    if (countdownTimer) clearInterval(countdownTimer);
                    countdownTimer = setInterval(() => {
                        remaining -= 1;
                        if (remaining <= 0) {
                            clearInterval(countdownTimer);
                            countdownTimer = null;
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Send Reset Link';
                            msgDiv.textContent = 'Cooldown finished. You may try again now.';
                            msgDiv.style.color = 'var(--color-secondary)';
                        } else {
                            renderCountdown();
                        }
                    }, 1000);
                } else if (err.status === 408 || err.isTimeout) {
                    msgDiv.style.color = '#FB7185';
                    msgDiv.textContent = 'The request timed out. Please check your internet connection and try again.';
                } else if (err.status === 500) {
                    msgDiv.style.color = '#FB7185';
                    msgDiv.textContent = err.message || 'Email delivery service temporarily unavailable. Please try again shortly.';
                } else {
                    // Safe anti-enumeration response
                    msgDiv.style.color = 'var(--color-secondary)';
                    msgDiv.textContent = 'If an account with that email exists, password reset instructions have been sent.';
                }
            } finally {
                if (!countdownTimer) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            }
        });
    </script>
    <script type="module" src="js/navbar.js"></script>
</body>
</html>
