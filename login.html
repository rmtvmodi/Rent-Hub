<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – RentHub</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">RentHub</a>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Browse Products</a></li>
            <li><a href="about.html">About</a></li>
            <li id="nav-auth"><a href="login.html" id="login-link" class="active">Login / Register</a></li>
        </ul>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-controls="nav-links" aria-expanded="false">&#9776;</button>
    </nav>

    <main style="padding:2.5rem 1.5rem 4rem;">
        <section class="auth-section card" style="max-width:440px; margin:auto;">
            <h2 class="text-center" style="margin-bottom:1.5rem;">Sign In to RentHub</h2>
            <form id="login-form" class="auth-form">
                <label for="login-email">Email Address
                    <input type="email" id="login-email" placeholder="name@example.com" required />
                </label>
                <label for="login-password">Password
                    <input type="password" id="login-password" placeholder="••••••••" required />
                </label>
                <div style="display:flex; justify-content:flex-end; margin-top:0.35rem; margin-bottom:0.85rem;">
                    <a href="forgot-password.html" style="font-size:0.85rem; color:var(--color-secondary);">Forgot password?</a>
                </div>
                <button type="submit" class="btn primary" style="width:100%;">Login</button>
            </form>
            <div id="login-message" class="message text-center"></div>
            
            <p class="text-center" style="font-size:0.9rem; margin-top:1rem;">Don't have an account? <a href="register.html">Register here</a></p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <h3>RentHub</h3>
            <p>&copy; 2026 RentHub – Rent Before You Buy. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="js/storage.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/navbar.js"></script>
</body>
</html>
